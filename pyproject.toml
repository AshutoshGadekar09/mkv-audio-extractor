[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mkv-audio-extractor"
version = "1.0.0"
description = "Extract audio tracks from MKV files with language selection"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Ashutosh Gadekar"}]
keywords = ["mkv", "audio", "extractor", "ffmpeg", "ffprobe"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/AshutoshGadekar09/mkv-audio-extractor"
Repository = "https://github.com/AshutoshGadekar09/mkv-audio-extractor"
Issues = "https://github.com/AshutoshGadekar09/mkv-audio-extractor/issues"

[project.optional-dependencies]
gui = ["PyQt6>=6.5.0"]
dev = ["pytest>=7.0", "PyQt6>=6.5.0"]

[project.scripts]
mkv-audio-extractor = "mkv_audio_extractor.__main__:main"

[tool.setuptools.packages.find]
include = ["mkv_audio_extractor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
