name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .
          pip install PyQt6 || true

      - name: Run pytest
        run: |
          pytest tests/ -v

  build-deb:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Debian package
        run: |
          chmod +x build-deb.sh
          ./build-deb.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkv-audio-extractor-deb
          path: dist/*.deb

  build-windows-exe:
    runs-on: windows-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller pillow
          pip install -e .

      - name: Build Standalone Windows Executable
        run: |
          pyinstaller --clean mkv-audio-extractor.spec

      - name: Create Windows ZIP Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/mkv-audio-extractor.exe, README.md, LICENSE -DestinationPath dist/mkv-audio-extractor-windows-x64.zip -Force

      - name: Upload Windows .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkv-audio-extractor-windows-exe
          path: dist/mkv-audio-extractor.exe

      - name: Upload Windows ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: mkv-audio-extractor-windows-zip
          path: dist/mkv-audio-extractor-windows-x64.zip
