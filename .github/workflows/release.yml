name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Debian package
        run: |
          chmod +x build-deb.sh
          ./build-deb.sh

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller pillow
          pip install -e .

      - name: Build Standalone Windows Executable
        run: |
          pyinstaller --clean mkv-audio-extractor.spec

      - name: Create Windows ZIP Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/mkv-audio-extractor.exe, README.md, LICENSE -DestinationPath dist/mkv-audio-extractor-windows-x64.zip -Force

      - name: Upload windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/mkv-audio-extractor*

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-deb, build-windows]
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download deb artifact
        uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: release-assets/

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
